<!-- Supabase → Authentication → Emails → Templates → Confirm signup
     Assunto sugerido: Seu código para entrar na Taverna Inicial -->
<div style="margin:0;padding:32px 16px;background:#3b2618;font-family:Georgia,'Palatino Linotype',serif;">
  <div style="max-width:480px;margin:0 auto;background:#f6ecd4;border:1px solid #b89a63;border-radius:10px;padding:32px 28px;color:#2a1c12;text-align:center;">
    <p style="margin:0 0 4px;font-size:14px;color:#8d6a2c;letter-spacing:1px;">Taverna Inicial</p>
    <h1 style="margin:0 0 16px;font-size:26px;line-height:1.2;">Uma coruja chegou com seu código!</h1>
    <p style="margin:0 0 20px;font-size:16px;line-height:1.6;color:#6f5a44;">
      Digite o código abaixo na tela de confirmação para ativar sua conta e entrar na Taverna.
    </p>
    <div style="display:inline-block;margin:0 0 20px;padding:14px 22px;background:#fbf4e2;border:2px solid #c39a4e;border-radius:8px;font-size:34px;font-weight:bold;letter-spacing:10px;color:#7c2e13;">
      {{ .Token }}
    </div>
    <p style="margin:0;font-size:13px;line-height:1.6;color:#6f5a44;">
      O código expira em pouco tempo. Se você não criou uma conta na Taverna Inicial, pode ignorar este e-mail.
    </p>
  </div>
</div>
